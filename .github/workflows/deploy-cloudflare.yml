name: Deploy to Cloudflare Pages (100% Free)

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Dependencies
        run: |
          pip install -r requirements.txt
          pip install -e .

      - name: Build Static Site with GravityPress SSG
        run: |
          gravitypress build --output dist

      - name: Check Cloudflare Credentials
        id: check_credentials
        run: |
          if [ -n "${{ secrets.CLOUDFLARE_API_TOKEN }}" ] && [ -n "${{ secrets.CLOUDFLARE_ACCOUNT_ID }}" ]; then
            echo "has_credentials=true" >> $GITHUB_OUTPUT
            echo "Cloudflare credentials detected in repository secrets."
          else
            echo "has_credentials=false" >> $GITHUB_OUTPUT
            echo "Cloudflare secrets (CLOUDFLARE_API_TOKEN, CLOUDFLARE_ACCOUNT_ID) not configured."
            echo "Static site build was successfully verified in dist/."
          fi

      - name: Deploy to Cloudflare Pages
        if: steps.check_credentials.outputs.has_credentials == 'true'
        uses: cloudflare/pages-action@v1
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          projectName: gravity-press-site
          directory: dist
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}
